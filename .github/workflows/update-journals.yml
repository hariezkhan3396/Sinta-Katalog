name: Perbarui Data Jurnal Sinta

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Jumlah halaman maksimum yang di-scrape (kosongkan = semua)"
        required: false
        default: "1546"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi
        run: pip install requests beautifulsoup4

      - name: Jalankan scraper
        working-directory: scraper
        run: |
          python scrape_sinta.py \
            --max-pages "${{ github.event.inputs.max_pages || '1546' }}" \
            --out ../data/journals.json \
            --meta-out ../data/meta.json

      - name: Commit perubahan data jika ada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/journals.json data/meta.json
          git diff --cached --quiet || git commit -m "chore: perbarui data jurnal Sinta ($(date +'%Y-%m-%d'))"
          git push
